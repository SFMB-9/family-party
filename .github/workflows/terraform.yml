name: Terraform

on:
  pull_request:
    paths: &tf_paths
      - "infra/live/**"
      - "services/**"
      - "packages/**"
      - ".github/workflows/terraform.yml"

  push:
    branches: [main]
    paths: *tf_paths

permissions:
  contents: read

# Never two Terraform runs at once, and never cancel one halfway through an apply.
concurrency:
  group: terraform-live
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # allows requesting the OIDC token for AWS
      pull-requests: write  # allows commenting on the PR
    defaults:
      run:
        working-directory: infra/live
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build Lambda bundle
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @family-party/game-session build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: mx-central-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan · \`infra/live\`"
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last --create-if-none

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # ⏸ waits for approval; also with the apply role trusts
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/live
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build Lambda bundle
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @family-party/game-session build

      - uses: aws-actions/configure-aws-ccredentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: mx-central-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - run: terraform init -input=false
      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
      - run: terraform apply -input=false -lock-timeout=120s tfplan
